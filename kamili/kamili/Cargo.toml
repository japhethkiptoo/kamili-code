[package]
name = "kamili"
description = "Kamili engine: spec-driven build pipeline. Channels use only the `api` surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["anthropic", "openai"]
# Real model clients. Without them only FakeLlm is compiled (offline tests).
anthropic = ["dep:reqwest"]
# OpenAI-compatible Chat Completions (NVIDIA NIM, OpenRouter, Ollama, vLLM, …).
openai = ["dep:reqwest"]

[dependencies]
async-trait.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
