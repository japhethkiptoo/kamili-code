[package]
name = "kamili-cli"
description = "The `kamili` executable: terminal channel and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kamili"
path = "src/main.rs"
# The engine library is also called `kamili`; avoid a doc output collision.
doc = false

[features]
default = ["anthropic", "openai", "acp"]
anthropic = ["kamili/anthropic", "dep:rpassword", "dep:serde", "dep:toml"]
# OpenAI-compatible providers ([provider] kind = "openai"): NVIDIA NIM, OpenRouter, Ollama, …
openai = ["kamili/openai"]
acp = ["dep:kamili-acp"]
# `kamili desktop`: a native window (gpui-kit). Off by default: GPUI is large
# and needs a recent Rust toolchain (see docs/DEVELOPMENT.md).
desktop = ["dep:kamili-desktop"]

[dependencies]
async-trait.workspace = true
clap.workspace = true
kamili.workspace = true
kamili-acp = { workspace = true, optional = true }
kamili-desktop = { workspace = true, optional = true }
rpassword = { version = "7", optional = true }
serde = { workspace = true, optional = true }
tokio.workspace = true
toml = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
